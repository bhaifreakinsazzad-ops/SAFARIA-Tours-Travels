name: SAFARIA Staging Release CI

on:
  push:
    branches: [ "main", "feat/*" ]
  pull_request:
    branches: [ "main", "feat/*" ]

jobs:
  verify:
    name: Typecheck, Test & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: design-system

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: design-system/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Execute Vitest Suite (Unit & Real PostgreSQL Integration)
        run: npm test

      - name: Build Next.js Production App
        run: npm run build
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'safaria-ci-build-signing-secret-emerald-gold-2026' }}
          NEXT_PHASE: phase-production-build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start Production Server
        run: |
          npm run start &
          npx wait-on http://localhost:3000 --timeout 60000
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'safaria-ci-build-signing-secret-emerald-gold-2026' }}

      - name: Execute Playwright E2E Browser Suite
        run: npm run test:e2e
